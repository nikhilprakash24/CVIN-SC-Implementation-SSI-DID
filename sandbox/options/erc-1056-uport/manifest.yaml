kind: on-chain
contracts:
- 1_blockchain-identity/contracts/ERC1056/EthereumDIDRegistry.sol
- 1_blockchain-identity/contracts/ERC1056/CVINVehicleDIDRegistry.sol
provider: null
benchmark_key: ERC-1056
experiments: []
benchmark_ops:
  deployRegistry: Single shared registry for all identities (deployed once per network).
  createIdentity: 'Identity exists implicitly (every address is a DID, zero-cost). Measured: first setAttribute
    publishing a verification key.'
  updateAttribute: setAttribute rotating the published key (event-only storage; DID document built off-chain from
    event history).
  addDelegateOrClaim: addDelegate(veriKey) with 1-year validity. On-chain claims are not part of ERC-1056.
  revoke: revokeAttribute of the published key. revokeDelegate is also supported at similar cost.
  transferOwnership: 'changeOwner: rotates the controlling key of the DID (identifier itself is stable).'
