benchmark_key: ERC-1155
experiments: []
benchmark_ops:
  deployRegistry: Single shared multi-token credential contract; deployer receives DEFAULT_ADMIN_ROLE and ISSUER_ROLE
    in constructor.
  createIdentity: 'registerVehicle (issuer-only): mints one soulbound BIRTH_CERT token, binds VIN string + vinHash
    mappings to the vehicle address.'
  updateAttribute: 'No key/attribute model in ERC-1155. Measured closest analogue: setTokenURI per-credential-type
    metadata URI override (issuer-only).'
  addDelegateOrClaim: 'issueCredential (issuer-only): mints an INSPECTION_CERT credential token to a registered
    vehicle (claim analogue; delegates are not part of ERC-1155).'
  revoke: revokeCredential (issuer-only burn) of the inspection credential. Burning the BIRTH_CERT would deregister
    the whole identity.
  transferOwnership: 'issuerTransferCredential of the BIRTH_CERT: re-binds VIN + registration mappings to the new
    vehicle address. Credentials are soulbound - holder-initiated transfers revert by design.'
