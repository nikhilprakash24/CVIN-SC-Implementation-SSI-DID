experiments: []
benchmark_ops:
  deployRegistry: 'No shared registry in ERC-725: each identity is its own ERC-725 smart-account contract. Deployment
    cost is counted under createIdentity.'
  createIdentity: Per-vehicle ERC-725 (X+Y) smart-account deployment (proxy account); constructor sets the deployer
    as owner/controlling key. Paid once per identity. Heavier than the ERC-725 'basic' variant because it bundles
    the full ERC-725X generic executor and ERC-725Y data store.
  updateAttribute: 'ERC-725Y setData(bytes32,bytes): writes the vehicle VIN attribute into the generic key/value
    store (cold slot first write, DataChanged event).'
  addDelegateOrClaim: ERC-725 has no native delegate or on-chain claim model. Verification-key delegation lives
    in ERC-1056 and on-chain claims in the companion ERC-735 claim holder (both benchmarked separately).
  revoke: 'ERC-725 has no identity-level revocation primitive: the account contract persists. Individual attributes
    can be cleared via setData(key, "0x") and control can be renounced via renounceOwnership, but neither is a standard
    revoke operation.'
  transferOwnership: transferOwnership of the ERC-725 account = controlling-key rotation; the identity (account
    address) is unchanged.
