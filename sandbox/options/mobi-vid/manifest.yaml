option: MOBI VID I + II (application profile)
slug: mobi-vid
kind: on-chain
contracts:
- 1_blockchain-identity/contracts/MOBI/MOBIVIDRegistry.sol
- 1_blockchain-identity/contracts/MOBI/MOBIVIDRegistryV2.sol
provider: cv2x-testbed/identity/mobi_vid_provider.py
benchmark_key: MOBI-VID-V2
experiments:
- '#30'
benchmark_ops:
  deployRegistry: Single shared registry (V2 = ERC-1056 base + MOBI VID I birth certificates + VID II lifecycle
    events); deployer becomes registry authority + authorized manufacturer.
  createIdentity: 'registerVehicleBirth (MOBI VID I birth certificate): VIN hash + encrypted VIN + cert hash + first
    owner. birthAttributes left empty to avoid known V1 validity-overflow bug.'
  updateAttribute: 'recordLifecycleEvent (MOBI VID II, MAINTENANCE): stores full event struct + VC hash + counters
    on-chain. Issuer authorization excluded as setup.'
  addDelegateOrClaim: 'Inherited ERC-1056 addDelegate (sigAuth, 1 year). V2-native multi-party attestEvent (claim
    analogue, 65-byte signature stored) measured separately: 192683 gas.'
  transferOwnership: 'transferVehicleOwnership: appends odometer-stamped ownership record + ERC-1056 changeOwner.
    Called by current owner.'
  revoke: 'revokeIdentity (inherited ERC-1056 extension): permanently flags the vehicle DID as revoked (decommissioning).'
