benchmark_ops:
  deployRegistry: Single shared NFT contract; deployer receives DEFAULT_ADMIN_ROLE and MANUFACTURER_ROLE in constructor.
  createIdentity: 'mintVehicle (manufacturer-only): mints NFT, stores VIN mapping + on-chain metadata struct + initial
    transfer record.'
  updateAttribute: 'No key/attribute model in ERC-721. Measured closest analogue: addServiceRecord appending a metadata
    URI (role grant excluded as setup).'
  addDelegateOrClaim: 'approve(): delegates TRANSFER rights only - not a verification-key delegation or identity
    claim as in DID standards.'
  transferOwnership: 'transferFrom: token transfer with on-chain transfer-history bookkeeping (contract overrides
    _update).'
  revoke: 'deactivateVehicle (admin-only): marks identity inactive; token itself is not burned.'
