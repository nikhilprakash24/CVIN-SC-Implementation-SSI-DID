experiments: []
benchmark_ops:
  deployRegistry: 'No shared registry in ERC-735: each vehicle identity is its own claim-holder contract. Deployment
    cost is counted under createIdentity.'
  createIdentity: Per-vehicle claim-holder contract deployment (constructor stores VIN + vinHash, deployer becomes
    owner). Paid once per identity.
  addDelegateOrClaim: 'addClaim (new claim, ClaimAdded): stores full signed claim on-chain after verifying the issuer''s
    EIP-191 signature over (identity, topic, data) via ecrecover. Delegates are not part of ERC-735.'
  updateAttribute: 'No key/attribute model in ERC-735. Measured closest analogue: re-adding a claim for the same
    (issuer, topic) updates it in place (ClaimChanged, warm same-size rewrite of data/signature/URI).'
  revoke: 'removeClaim (owner or issuer): deletes the claim struct and compacts the topic index (ClaimRemoved, storage
    refund applies).'
  transferOwnership: transferOwnership of the per-vehicle claim-holder contract to the new vehicle owner.
