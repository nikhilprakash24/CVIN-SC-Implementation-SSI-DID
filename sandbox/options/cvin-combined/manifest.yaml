benchmark_key: CVIN-Combined
experiments: []
benchmark_ops:
  deployRegistry: Single shared hybrid registry (ERC-1056 event-based identity + ERC-735 on-chain claim storage
    in one contract).
  createIdentity: 'Identity exists implicitly (ERC-1056 side: every address is a DID, zero-cost). Measured: first
    setAttribute publishing a verification key (event-only).'
  updateAttribute: setAttribute rotating the published key (ERC-1056 side, event-only storage).
  addDelegateOrClaim: 'addClaim (ERC-735 side): verifies the issuer''s raw-digest ECDSA signature via ecrecover
    and stores the full claim on-chain (O(1) verification thereafter). Event-only ERC-1056 addDelegate measured
    separately: 55162 gas.'
  revoke: 'removeClaim (ERC-735 side): deletes the stored claim + topic index (storage refund applies). Event-only
    revokeAttribute/revokeDelegate (ERC-1056 side) also supported at ~ERC-1056 cost.'
  transferOwnership: 'changeOwner (ERC-1056 side): rotates the controlling key of the DID (identifier stable).'
