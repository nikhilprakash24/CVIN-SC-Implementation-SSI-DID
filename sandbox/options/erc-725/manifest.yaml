  deployRegistry: 'No shared registry in ERC-725: each identity is its own proxy-account contract. Deployment cost
    is counted under createIdentity.'
  createIdentity: Per-vehicle identity contract deployment (proxy account); deployer becomes owner/management key.
    Paid once per identity.
  updateAttribute: 'addKey(purpose=1 MANAGEMENT, type=1 ECDSA): key rotation/addition stored in contract state.'
  addDelegateOrClaim: addKey(purpose=3 CLAIM signer key). Full on-chain claim storage lives in the companion ERC-735
    claim holder, benchmarked separately as ERC-735.
  revoke: 'removeKey: deletes key and compacts the key array (cost grows with number of stored keys).'
  transferOwnership: transferOwnership of the identity contract to the new vehicle owner.
