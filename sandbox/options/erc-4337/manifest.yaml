experiments: []
benchmark_ops:
  deployRegistry: 'CVINMinimalEntryPoint deployment (shared infrastructure, analogous to a registry). NOTE: minimal
    research harness, not the canonical v0.7 EntryPoint - no bundler batching, paymasters, deposits or gas accounting.'
  createIdentity: 'Per-vehicle smart-account deployment (identity creation): the account address is the stable vehicle
    identifier; the signing key can rotate without changing it. Direct deploy - no initCode/AccountFactory counterfactual
    deployment.'
  updateAttribute: setAttribute called DIRECTLY by the owner key (ERC-725Y-flavoured attribute store, cold slot
    first write).
  updateAttributeVia4337: 'Same setAttribute routed as a PackedUserOperation through the EntryPoint (handleOp ->
    validateUserOp [ecrecover] -> execute -> self-call). Indirection overhead vs direct call: 46830 gas. EXCLUDES
    real-world bundler overhead (mempool, handleOps batching, paymaster, deposit/refund accounting).'
  addDelegateOrClaim: 'setGuardian: designates a social-recovery guardian (recovery-delegate analogue; recovery
    capability unique to contract accounts). No on-chain claim model in ERC-4337.'
  transferOwnership: transferOwnership = signing-key rotation; the identity (account address) is unchanged. Guardian-driven
    recoverOwner measured separately (see revoke notes).
  revoke: 'setGuardian(0): revokes the recovery guardian (delegate-revocation analogue; storage clear, refund applies).
    ERC-4337 has no identity-level revocation - the account contract persists. Guardian recoverOwner (social recovery,
    new signing key installed by guardian) measured separately: 30952 gas.'
