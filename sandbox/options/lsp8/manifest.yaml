provider: null
benchmark_key: LSP8
experiments: []
benchmark_ops:
  deployRegistry: Single shared LSP8 collection contract; deployer becomes the issuing authority (contract owner).
  createIdentity: 'mintVehicle (authority-only): mints bytes32 tokenId = keccak256(VIN) and stores the VIN in the
    per-token LSP2-style data store.'
  updateAttribute: 'setDataForTokenId: writes a per-token ERC-725Y-style data key (TokenIdDataChanged + DataChanged
    events).'
  addDelegateOrClaim: 'Not supported by this representative LSP8 implementation: operator authorization (authorizeOperator)
    is not implemented, and LSP8 has no native claim model - attestations live in per-token data keys (covered by
    updateAttribute).'
  transferOwnership: LSP8 5-arg transfer(from, to, tokenId, force=true, data) by the token owner. force=true skips
    LSP1 universal-receiver probing (hooks omitted in this implementation).
  revoke: 'revokeVehicle (issuing authority or token owner): burns the token (Transfer to zero + VehicleRevoked);
    tokenId ceases to exist.'
