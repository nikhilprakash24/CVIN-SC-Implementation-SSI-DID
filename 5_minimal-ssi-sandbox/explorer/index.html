<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identity Sandbox Explorer</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1b1b1b; --muted:#666; --card:#fff; --line:#ddd; --acc:#0b5fff; --ok:#1a7f37; --bad:#b42318; --warn:#9a6700; --off:#6f42c1; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121212; --fg:#eaeaea; --muted:#9a9a9a; --card:#1c1c1c; --line:#333; --acc:#6ea8ff; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --off:#b98cff; } }
  :root[data-theme="dark"] { --bg:#121212; --fg:#eaeaea; --muted:#9a9a9a; --card:#1c1c1c; --line:#333; --acc:#6ea8ff; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --off:#b98cff; }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px } h2 { font-size:15px; margin:0 0 8px } .sub { color:var(--muted); margin-bottom:12px }
  .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0 }
  textarea { width:100%; height:110px; font:12px/1.4 ui-monospace, monospace; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px }
  button, input[type=file] { font:inherit } button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer }
  .err { color:var(--bad); white-space:pre-wrap } .muted { color:var(--muted) }
  table { width:100%; border-collapse:collapse; font-size:12.5px } th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top } th { color:var(--muted); font-weight:600 }
  .tag { display:inline-block; padding:1px 6px; border-radius:10px; font-size:11px; border:1px solid var(--line); margin-right:4px }
  .k-tx { border-color:var(--acc); color:var(--acc) } .k-view { border-color:var(--ok); color:var(--ok) } .k-offchain { border-color:var(--off); color:var(--off) } .k-deploy,.k-summary { color:var(--muted) }
  .cov { display:grid; grid-template-columns: repeat(6, 1fr); gap:6px } .cov div { border:1px solid var(--line); border-radius:6px; padding:6px; text-align:center; font-size:12px } .cov .hit { background:color-mix(in srgb, var(--ok) 18%, transparent); border-color:var(--ok) }
  .cov.ext { grid-template-columns: repeat(8, 1fr) }
  .id { border-left:3px solid var(--acc); padding-left:8px; margin-bottom:8px } .id b { display:block } .rev { color:var(--bad) } .okc { color:var(--ok) }
  .chan li { margin:2px 0 } .chan .down { color:var(--bad) } .chan .up { color:var(--ok) }
  .wrap { overflow:auto; max-height:420px } .note { word-break:break-word }
  @media (max-width:600px) { .cov { grid-template-columns: repeat(4,1fr) } .cov.ext { grid-template-columns: repeat(4,1fr) } }
</style>
</head>
<body>
<h1>Identity Sandbox Explorer</h1>
<div class="sub">Replays a JSONL execution trace from <code>traces/</code> (schema v1/v1.1). It renders what the trace contains and simulates nothing.</div>

<div class="card">
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
    <input type="file" id="file" accept=".jsonl,.txt">
    <button id="load">Load pasted trace</button>
    <span id="status" class="muted"></span>
  </div>
  <textarea id="paste" placeholder='Paste JSONL here (one JSON object per line) or choose a file above…'></textarea>
  <div id="err" class="err"></div>
</div>

<div class="grid" style="margin-top:12px">
  <div class="card"><h2>Coverage</h2><div id="covF" class="cov"></div><div style="height:8px"></div><div class="muted" style="font-size:12px">Extension tags</div><div id="covX" class="cov ext"></div><div id="covSum" class="muted" style="margin-top:6px"></div></div>
  <div class="card"><h2>Identities</h2><div id="ids"></div></div>
  <div class="card"><h2>I2I channel / off-chain</h2><ul id="chan" class="chan"></ul></div>
</div>
<div class="card" style="margin-top:12px"><h2>Timeline</h2><div class="wrap"><table id="tl"><thead><tr><th>#</th><th>kind</th><th>tag</th><th>function / phase</th><th>identity</th><th>gas</th><th>ms</th><th>note</th></tr></thead><tbody></tbody></table></div></div>

<script>
const F = ["F1","F2","F3","F4","F5","F6","F7","F8","F9","F10","F11","F12"];
const FN = {F1:"createDID",F2:"resolveDID",F3:"updateDID",F4:"deactivateDID",F5:"issueCredential",F6:"verifyCredential",F7:"revokeCredential",F8:"createPresentation",F9:"addVerificationMethod",F10:"removeVerificationMethod",F11:"addDelegate",F12:"validDelegate"};
const X = ["G0","G1","G2","G3","G4","T1","T2","B1","B2","B3","C1","C2","C3","C4","Z1","Z2","P1"];
const REQ = ["seq","impl","ts","kind"]; const KINDS = new Set(["tx","view","offchain","deploy","summary"]);
const $ = s => document.querySelector(s);

function parse(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) throw new Error("Empty input.");
  return lines.map((l, i) => {
    let e; try { e = JSON.parse(l); } catch { throw new Error(`Line ${i+1}: not valid JSON.`); }
    for (const k of REQ) if (!(k in e)) throw new Error(`Line ${i+1}: missing required field "${k}" (traces/SCHEMA.md).`);
    if (!KINDS.has(e.kind)) throw new Error(`Line ${i+1}: unknown kind "${e.kind}".`);
    if (e.kind === "tx" && (!e.txHash || e.gasUsed === undefined)) throw new Error(`Line ${i+1}: tx entry needs txHash and gasUsed.`);
    return e;
  });
}

function render(T) {
  const impl = T[0].impl, tags = new Set(T.filter(e => e.fnId).map(e => e.fnId));
  $("#status").textContent = `${impl} · ${T.length} entries · ${T.filter(e=>e.kind==="tx").length} tx · ${T.filter(e=>e.kind==="view").length} view · ${T.filter(e=>e.kind==="offchain").length} off-chain · total gas ${T.filter(e=>e.kind==="tx").reduce((s,e)=>s+Number(e.gasUsed),0).toLocaleString()}`;
  $("#covF").innerHTML = F.map(f => `<div class="${tags.has(f)?"hit":""}" title="${FN[f]}">${f}<br><span class="muted" style="font-size:10px">${FN[f].slice(0,12)}</span></div>`).join("");
  const xs = X.filter(x => tags.has(x)); $("#covX").innerHTML = xs.length ? xs.map(x => `<div class="hit">${x}</div>`).join("") : `<div class="muted">none</div>`;
  $("#covSum").textContent = `F-tags: ${F.filter(f=>tags.has(f)).length}/12`;

  // identities: derived from tx/view entries per acting identity + DID events in notes
  const ids = {};
  for (const e of T) {
    if (!e.identity) continue;
    const id = (ids[e.identity] ??= { tx:0, gas:0, keys:0, dels:0, creds:0, revoked:0, deact:false, pres:0 });
    if (e.kind === "tx") { id.tx++; id.gas += Number(e.gasUsed||0); }
    if (e.fnId === "F9") id.keys++; if (e.fnId === "F10") id.keys--; if (e.fnId === "F11") id.dels++;
    if (e.fnId === "F5") id.creds++; if (e.fnId === "F7") id.revoked++; if (e.fnId === "F4") id.deact = true; if (e.fnId === "F8") id.pres++;
  }
  $("#ids").innerHTML = Object.entries(ids).filter(([, i]) => i.tx > 0).map(([n, i]) => `<div class="id"><b>${n}${i.deact?' <span class="rev">· deactivated</span>':''}</b><span class="muted">${i.tx} tx · ${i.gas.toLocaleString()} gas</span><br>keys +${i.keys} · delegates ${i.dels} · issued ${i.creds} · revoked ${i.revoked} · presentations ${i.pres}</div>`).join("") || `<div class="muted">no acting identities in trace</div>`;

  // channel pane: off-chain entries + revocation teardown signals
  const chan = T.filter(e => e.kind === "offchain" || e.fnId === "F7" || (e.fnId === "F6" && /revoked=true|valid=false/.test(e.note||"")));
  $("#chan").innerHTML = chan.map(e => `<li class="${e.fnId==="F7"||/torn down|refused|REJECT|revoked=true/.test(e.note||"")?"down":"up"}">[${e.seq}] <b>${e.phase||e.fn}</b> <span class="muted">${e.identity||""}</span> — <span class="note">${(e.note||"").slice(0,220)}</span></li>`).join("") || `<li class="muted">no off-chain steps in trace</li>`;

  $("#tl tbody").innerHTML = T.map(e => `<tr><td>${e.seq}</td><td><span class="tag k-${e.kind}">${e.kind}</span></td><td>${e.fnId||""}</td><td>${e.fn||e.phase||""}</td><td>${e.identity||""}</td><td>${e.gasUsed?Number(e.gasUsed).toLocaleString():""}</td><td>${e.latencyMs??""}</td><td class="note">${e.note||""}</td></tr>`).join("");
}

function load(text) {
  $("#err").textContent = "";
  try { render(parse(text)); } catch (e) { $("#err").textContent = "Schema error: " + e.message; $("#status").textContent = ""; }
}
$("#load").onclick = () => load($("#paste").value);
$("#file").onchange = ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(load); };
</script>
</body>
</html>
