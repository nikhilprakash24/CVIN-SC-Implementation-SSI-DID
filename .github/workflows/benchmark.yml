name: Performance Benchmarks

# Runs the Hardhat test suite with hardhat-gas-reporter enabled and publishes
# gas-report.txt as a workflow artifact. hardhat.config.js already sets
# gasReporter.outputFile = "gas-report.txt" when REPORT_GAS=true.
#
# The earlier version of this workflow also ran DID-resolution / VC benchmark
# scripts and a thesis-table generator under 4_comparison-framework/. None of
# those scripts or that directory exist on this trunk, so those jobs were
# removed rather than left to fail silently.

on:
  push:
    branches: [ main ]
  schedule:
    # Nightly at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  gas-benchmarks:
    name: Gas report (hardhat-gas-reporter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1_blockchain-identity

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 1_blockchain-identity/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npx hardhat compile

    - name: Run tests with gas reporter
      env:
        REPORT_GAS: 'true'
      run: npx hardhat test

    - name: Check gas report was written
      shell: bash
      run: |
        test -s gas-report.txt || { echo "gas-report.txt missing or empty"; exit 1; }
        echo "gas-report.txt: $(wc -l < gas-report.txt) lines"
        {
          echo "## Gas report"
          echo '```'
          cat gas-report.txt
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

    - name: Upload gas report
      uses: actions/upload-artifact@v4
      with:
        name: gas-report
        path: 1_blockchain-identity/gas-report.txt
        if-no-files-found: error
