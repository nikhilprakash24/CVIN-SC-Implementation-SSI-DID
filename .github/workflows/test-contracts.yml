name: Smart Contract Tests

# Compiles and tests the Hardhat project in 1_blockchain-identity.
# Compiles every contract (solc 0.8.24, cancun) and runs the whole Hardhat tree; current totals are
# in sandbox/grand/report/GRAND_REPORT.md. The Python suites run in w3c-compliance.yml.

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    # any base branch: the repository's default branch is not `main` (after-action report 12, audit T-11)
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  hardhat-tests:
    name: Compile and test contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1_blockchain-identity

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # check_stamps.py verifies the stamp-only commits from history (WM-2 A2)

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 1_blockchain-identity/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npx hardhat compile

    - name: Phase 2 F1 IDTx prototype (behaviour tests against the unmodified ERC-1056 registry)
      run: npx hardhat --config hardhat.phase2.config.js test

    - name: Phase 2 F1 IDTx gate mutants (each must be caught; academic review AR-14)
      run: bash ../phase2/idtx/mutate_idtx.sh

    - name: Probe that the run-identity flags fire (after-action report 11; WM-2 A2, D49)
      # The producing-code "dirty" flags were inert until 2026-10-09 (relative pathspecs from a
      # subdirectory), and until WM-2 A2 they missed code a producer imports from outside its fixed path
      # list (D49). This fails if tools/run_identity/scopes.json is stale or a producer imports code
      # outside its scope, or if either stamp helper, for any producer of record, misses an edit to
      # imported code or a new input file, or counts a results file.
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        python3 -m pip install --quiet eth-account coincurve cryptography pytest
        bash docs/testing/probe_run_identity.sh
        # WM-2 A4: the promote step refuses every run that is not a run of record
        python3 -m pytest -q tools/run_identity/test_promote.py
        # Phase 2 F2: the database lifecycle backend (parity, tamper evidence)
        python3 -m pytest -q phase2/backends/test_sqlite_lifecycle.py

    - name: Check the MOBI contract copies are byte-identical (plan S0)
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        for c in ERC1056Registry MOBIVIDRegistry MOBIVIDRegistryV2; do
          cmp "1_blockchain-identity/contracts/MOBI/$c.sol" "cv2x-testbed/contracts/$c.sol" \
            || { echo "::error::$c.sol differs between 1_blockchain-identity/contracts/MOBI and cv2x-testbed/contracts"; exit 1; }
        done
        echo "MOBI copies identical"

    - name: Check the feature-asymmetry matrix is up to date (plan S0)
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        python3 4_comparison-framework/feature-matrix/make_feature_matrix.py > /dev/null
        git diff --exit-code -- docs/FEATURE_ASYMMETRY_MATRIX.md \
          || { echo "::error::docs/FEATURE_ASYMMETRY_MATRIX.md is stale: run the generator and commit"; exit 1; }
        echo "feature matrix up to date"

    - name: Check the dashboard snapshot and crux register are up to date (plan 2026-10-09 P1.2)
      # Both are generated from committed result files, the claim register and
      # docs/thesis/cruxes.yaml; a result or register change without regeneration fails here.
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        python3 -m pip install --quiet pyyaml
        python3 docs/figures/make_dashboard_data.py --check
        python3 docs/testing/build_register.py --check
        python3 docs/testing/check_docs_numbers.py
        python3 docs/presentation/make_presentation.py --check
        python3 docs/testing/check_stamps.py --check-coverage
        python3 docs/phase2/build_phase2.py --check
        python3 docs/phase2/focus/make_focus_figures.py --check
        python3 docs/phase2/focus/F3_interaction_modes/classify_modes.py --check

    - name: Run tests
      shell: bash
      run: |
        set -o pipefail
        npx hardhat test | tee /tmp/hardhat_test.txt

    - name: Check the test count against the grand report (after-action report 12, audit T-2)
      working-directory: ${{ github.workspace }}
      shell: bash
      run: python3 docs/testing/check_test_counts.py /tmp/hardhat_test.txt
