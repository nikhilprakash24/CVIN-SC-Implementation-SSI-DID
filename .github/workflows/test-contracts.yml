name: Smart Contract Tests

# Compiles and tests the Hardhat project in 1_blockchain-identity.
# Verified locally on this trunk: 32 contracts compile (solc 0.8.24, cancun),
# 47 tests pass. The VC-layer pytest suite runs in w3c-compliance.yml.

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hardhat-tests:
    name: Compile and test contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1_blockchain-identity

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 1_blockchain-identity/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npx hardhat compile

    - name: Run tests
      run: npx hardhat test
