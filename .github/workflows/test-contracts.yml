name: Smart Contract Tests

# Compiles and tests the Hardhat project in 1_blockchain-identity.
# Compiles every contract (solc 0.8.24, cancun) and runs the whole Hardhat tree; current totals are
# in sandbox/grand/report/GRAND_REPORT.md. The Python suites run in w3c-compliance.yml.

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    # any base branch: the repository's default branch is not `main` (after-action report 12, audit T-11)
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  hardhat-tests:
    name: Compile and test contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1_blockchain-identity

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 1_blockchain-identity/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npx hardhat compile

    - name: Probe that the run-identity flags fire (after-action report 11)
      # The producing-code "dirty" flags of the JS run stamp and the Python headers were inert until
      # 2026-10-09 (relative pathspecs from a subdirectory). This fails if either stops detecting an
      # untracked file in a producing path, or starts counting a results file.
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        python3 -m pip install --quiet eth-account coincurve cryptography
        bash docs/testing/probe_run_identity.sh

    - name: Check the MOBI contract copies are byte-identical (plan S0)
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        for c in ERC1056Registry MOBIVIDRegistry MOBIVIDRegistryV2; do
          cmp "1_blockchain-identity/contracts/MOBI/$c.sol" "cv2x-testbed/contracts/$c.sol" \
            || { echo "::error::$c.sol differs between 1_blockchain-identity/contracts/MOBI and cv2x-testbed/contracts"; exit 1; }
        done
        echo "MOBI copies identical"

    - name: Check the feature-asymmetry matrix is up to date (plan S0)
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        python3 4_comparison-framework/feature-matrix/make_feature_matrix.py > /dev/null
        git diff --exit-code -- docs/FEATURE_ASYMMETRY_MATRIX.md \
          || { echo "::error::docs/FEATURE_ASYMMETRY_MATRIX.md is stale: run the generator and commit"; exit 1; }
        echo "feature matrix up to date"

    - name: Check the dashboard snapshot and crux register are up to date (plan 2026-10-09 P1.2)
      # Both are generated from committed result files, the claim register and
      # docs/thesis/cruxes.yaml; a result or register change without regeneration fails here.
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        python3 -m pip install --quiet pyyaml
        python3 docs/figures/make_dashboard_data.py --check
        python3 docs/testing/build_register.py --check
        python3 docs/testing/check_docs_numbers.py
        python3 docs/presentation/make_presentation.py --check

    - name: Run tests
      shell: bash
      run: |
        set -o pipefail
        npx hardhat test | tee /tmp/hardhat_test.txt

    - name: Check the test count against the grand report (after-action report 12, audit T-2)
      working-directory: ${{ github.workspace }}
      shell: bash
      run: python3 docs/testing/check_test_counts.py /tmp/hardhat_test.txt
