name: W3C SSI Compliance Tests

# Two checks:
#   1. The W3C VC layer (2_w3c-ssi-layer/verifiable-credentials) pytest suite.
#      Verified locally on this trunk: 28 passing.
#   2. The W3C compliance checker (cv2x-testbed/scripts/w3c_compliance_checker.py),
#      which scores the implementation against DID Core, VC Data Model and SSI
#      principles and writes w3c_compliance_report.json.
#
# Python deps are installed unpinned. 2_w3c-ssi-layer/requirements.txt pins
# did-jwt==0.1.0, which does not exist on PyPI, so that file cannot be
# installed as-is. The VC tests only need eth-account, coincurve, cryptography
# and pytest; the checker itself is stdlib-only.

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  vc-layer-tests:
    name: VC layer pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2_w3c-ssi-layer/verifiable-credentials

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: python -m pip install eth-account coincurve cryptography pytest

    - name: Run VC layer tests
      run: python -m pytest tests/test_vc_layer.py -v

  compliance-score:
    name: W3C compliance score
    runs-on: ubuntu-latest
    # COMPLIANCE_FLOOR is the gate; COMPLIANCE_TARGET is aspirational.
    #
    # Why the floor is 93.0: after the analysis-lineage merge (2026-09-24) the
    # checker's verified score on this trunk is 93.2% (its two documented
    # deviations are counted as FAIL by design). Earlier floor: 89.0 at 89.6%. The previous
    # version of this workflow claimed a ">90%" gate, which would have failed
    # on day one and was never actually enforced (the step was an echo). The
    # floor is set just under the current verified level so that any regression
    # fails CI, while the 90% thesis target is printed so progress toward it is
    # visible. Raise COMPLIANCE_FLOOR when the score genuinely goes up.
    env:
      COMPLIANCE_FLOOR: '93.0'
      COMPLIANCE_TARGET: '90.0'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Run W3C compliance checker
      shell: bash
      run: |
        set -o pipefail
        python cv2x-testbed/scripts/w3c_compliance_checker.py | tee w3c_compliance_output.log

    - name: Gate on compliance floor
      shell: bash
      run: |
        SCORE=$(grep -oE 'OVERALL COMPLIANCE SCORE: [0-9]+(\.[0-9]+)?%' w3c_compliance_output.log | grep -oE '[0-9]+(\.[0-9]+)?' || true)
        if [ -z "$SCORE" ]; then
          echo "::error::Could not parse 'OVERALL COMPLIANCE SCORE' from checker output"
          exit 1
        fi
        echo "W3C compliance score : ${SCORE}%"
        echo "Enforced floor       : ${COMPLIANCE_FLOOR}% (fail below this)"
        echo "Thesis target        : ${COMPLIANCE_TARGET}% (not yet enforced)"
        {
          echo "## W3C compliance"
          echo "| Score | Floor (enforced) | Target |"
          echo "|-------|------------------|--------|"
          echo "| ${SCORE}% | ${COMPLIANCE_FLOOR}% | ${COMPLIANCE_TARGET}% |"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        if awk -v s="$SCORE" -v f="$COMPLIANCE_FLOOR" 'BEGIN { exit !(s + 0 >= f + 0) }'; then
          if awk -v s="$SCORE" -v t="$COMPLIANCE_TARGET" 'BEGIN { exit !(s + 0 >= t + 0) }'; then
            echo "Score meets the ${COMPLIANCE_TARGET}% target."
          else
            echo "::notice::Score ${SCORE}% is above the ${COMPLIANCE_FLOOR}% floor but below the ${COMPLIANCE_TARGET}% target."
          fi
        else
          echo "::error::W3C compliance score ${SCORE}% is below the enforced floor of ${COMPLIANCE_FLOOR}%"
          exit 1
        fi

    - name: Upload compliance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: w3c-compliance-report
        path: |
          w3c_compliance_report.json
          w3c_compliance_output.log
        if-no-files-found: error
