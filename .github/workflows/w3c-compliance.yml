name: W3C SSI Compliance Tests

# Two checks:
#   1. The W3C VC layer (2_w3c-ssi-layer/verifiable-credentials) pytest suite.
#      Verified locally on this trunk: 28 passing. (All suites: python-full-suite.)
#   2. The W3C compliance checker (cv2x-testbed/scripts/w3c_compliance_checker.py),
#      which scores the implementation against DID Core, VC Data Model and SSI
#      principles and writes w3c_compliance_report.json.
#
# Python deps are installed unpinned. 2_w3c-ssi-layer/requirements.txt pins
# did-jwt==0.1.0, which does not exist on PyPI, so that file cannot be
# installed as-is. The VC tests only need eth-account, coincurve, cryptography
# and pytest; the checker itself is stdlib-only.

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    # any base branch: the repository's default branch is not `main` (after-action report 12, audit T-11)
    branches: [ '**' ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  vc-layer-tests:
    name: VC layer pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2_w3c-ssi-layer/verifiable-credentials

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: python -m pip install eth-account coincurve cryptography pytest

    - name: Run VC layer tests
      run: python -m pytest tests/test_vc_layer.py -v

  python-full-suite:
    # Review 2 (Q-2): the vc-layer job above runs only test_vc_layer.py. This
    # job runs every Python suite: the MOBI VID layer (starts its own Hardhat
    # node on 8547), the DID resolver and review-02 negative tests, and
    # cv2x-testbed/tests (on-chain cases use a node on 8548 and contracts
    # compiled from 1_blockchain-identity/contracts/MOBI, because the tracked
    # cv2x-testbed/artifacts predate the source fixes). A skipped test fails
    # the job: every suite skips cleanly when its node is missing, and a skip
    # must not read as green.
    name: All Python suites (no skips)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 1_blockchain-identity/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        (cd 1_blockchain-identity && npm ci && npx hardhat compile)
        python -m pip install eth-account coincurve cryptography web3 pytest numpy

    - name: Testbed artifacts match a fresh compile
      # Review 02 R2-H2: the tracked cv2x-testbed/artifacts (loaded by the #21/#22
      # experiment and the testbed tests without a compile step) were once stale.
      # Compiles the testbed contracts with its own config (solc 0.8.20) and
      # fails if any tracked ABI/bytecode differs.
      shell: bash
      run: |
        ln -sfn ../1_blockchain-identity/node_modules cv2x-testbed/node_modules
        (cd cv2x-testbed && node scripts/check_artifacts_fresh.js)
        rm cv2x-testbed/node_modules

    - name: Start Hardhat node for cv2x-testbed on-chain tests
      shell: bash
      run: |
        (cd 1_blockchain-identity && nohup npx hardhat node --port 8548 > /tmp/node8548.log 2>&1 &)
        for i in $(seq 1 60); do grep -q "Started HTTP" /tmp/node8548.log && break; sleep 1; done
        grep -q "Started HTTP" /tmp/node8548.log || { cat /tmp/node8548.log; exit 1; }
        mkdir -p /tmp/cv2x-art && ln -sfn "$GITHUB_WORKSPACE/1_blockchain-identity/artifacts/contracts/MOBI" /tmp/cv2x-art/contracts

    - name: Run all Python suites
      shell: bash
      env:
        CV2X_TEST_RPC_URL: http://127.0.0.1:8548
        CV2X_TEST_ARTIFACTS_DIR: /tmp/cv2x-art
      run: |
        set -o pipefail
        python -m pytest 2_w3c-ssi-layer cv2x-testbed/tests -q -rs | tee pytest.log
        if grep -qE '[0-9]+ skipped' pytest.log; then
          echo "::error::Python tests were skipped; see the SKIPPED lines above"
          exit 1
        fi

  compliance-score:
    name: W3C compliance score
    runs-on: ubuntu-latest
    # COMPLIANCE_FLOOR is the gate; COMPLIANCE_TARGET is aspirational.
    #
    # Why the floor is 94.0: after the resolver conformance fixes (2026-10-03) the
    # checker's verified score on this trunk is 94.3% (93.2% at the merge) (its two documented
    # deviations are counted as FAIL by design). Earlier floor: 89.0 at 89.6%. The previous
    # version of this workflow claimed a ">90%" gate, which would have failed
    # on day one and was never actually enforced (the step was an echo). The
    # floor is set just under the current verified level so that any regression
    # fails CI, while the 90% thesis target is printed so progress toward it is
    # visible. Raise COMPLIANCE_FLOOR when the score genuinely goes up.
    env:
      COMPLIANCE_FLOOR: '94.0'
      COMPLIANCE_TARGET: '90.0'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      # The merged checker imports the VC layer (EIP-191 / secp256k1 proofs),
      # so it needs the same packages as the VC job. Unpinned: see header note.
      run: pip install eth-account coincurve cryptography web3

    - name: Run W3C compliance checker
      shell: bash
      run: |
        set -o pipefail
        python cv2x-testbed/scripts/w3c_compliance_checker.py | tee w3c_compliance_output.log

    - name: Gate on compliance floor
      shell: bash
      run: |
        SCORE=$(grep -oE '(OVERALL|EXECUTABLE) COMPLIANCE SCORE: [0-9]+(\.[0-9]+)?%' w3c_compliance_output.log | grep -oE '[0-9]+(\.[0-9]+)?' || true)
        if [ -z "$SCORE" ]; then
          echo "::error::Could not parse '(OVERALL|EXECUTABLE) COMPLIANCE SCORE' from checker output"
          exit 1
        fi
        echo "W3C compliance score : ${SCORE}%"
        echo "Enforced floor       : ${COMPLIANCE_FLOOR}% (fail below this)"
        echo "Thesis target        : ${COMPLIANCE_TARGET}% (not yet enforced)"
        {
          echo "## W3C compliance"
          echo "| Score | Floor (enforced) | Target |"
          echo "|-------|------------------|--------|"
          echo "| ${SCORE}% | ${COMPLIANCE_FLOOR}% | ${COMPLIANCE_TARGET}% |"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        if awk -v s="$SCORE" -v f="$COMPLIANCE_FLOOR" 'BEGIN { exit !(s + 0 >= f + 0) }'; then
          if awk -v s="$SCORE" -v t="$COMPLIANCE_TARGET" 'BEGIN { exit !(s + 0 >= t + 0) }'; then
            echo "Score meets the ${COMPLIANCE_TARGET}% target."
          else
            echo "::notice::Score ${SCORE}% is above the ${COMPLIANCE_FLOOR}% floor but below the ${COMPLIANCE_TARGET}% target."
          fi
        else
          echo "::error::W3C compliance score ${SCORE}% is below the enforced floor of ${COMPLIANCE_FLOOR}%"
          exit 1
        fi

    - name: Upload compliance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: w3c-compliance-report
        path: |
          w3c_compliance_report.json
          w3c_compliance_output.log
        if-no-files-found: error

  python-layers:
    name: Python layers L3 + L4 (sandbox/py-suites/run.sh)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      # Same packages as the VC job; the L4 use cases and the V2V harness smoke are
      # in-process (no chain). Unpinned: see the header note.
      run: pip install eth-account coincurve cryptography web3 pytest

    - name: Run the Python layers (L3 SSI, L4 exemplar interactions, SSI-layer suites)
      run: sandbox/py-suites/run.sh
