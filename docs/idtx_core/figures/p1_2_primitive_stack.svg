<text x="14.0" y="536.0" font-family="DejaVu Sans, sans-serif" font-size="7.2" fill="#898781" text-anchor="start" font-weight="normal" font-style="normal">Source: PLAN.md §4.2, PRIMITIVES.md, FUNCTION_MAP.md. Read bottom-up: a signature proves control of a key; a key is an identifier; resolve() gives its document; a credential is a signed claim anchored to an issuer key; a presentation discloses it; an IDTx consumes identity state as a precondition. No ERC provides createPresentation natively.</text>
