<text x="14.0" y="578.0" font-family="DejaVu Sans, sans-serif" font-size="7.2" fill="#898781" text-anchor="start" font-weight="normal" font-style="normal">Source: BASIC_ID_SET_EXTENSION.md §2. The basic set asks one yes/no question per substrate (the conformance gate). The catalogue keeps that gate and adds cost/footprint (L1), lifecycle composition (L2), the verifier's read path (L6), population &amp; history scale (L3) and breadth (10 substrates), so the admitted set can be measured and ranked.</text>
