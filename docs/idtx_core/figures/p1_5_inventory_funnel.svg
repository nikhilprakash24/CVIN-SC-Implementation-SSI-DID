<text x="14.0" y="498.0" font-family="DejaVu Sans, sans-serif" font-size="7.2" fill="#898781" text-anchor="start" font-weight="normal" font-style="normal">Source: ANALYSIS.md §4.2 (26 = 25 CAPTURE.md §5 instances + payToll). Six classes: IDTx 4, identity-admin/sender-auth 10, admission-auth 4, enabling view 1, identity-dependent decision (off chain) 5, not-a-dependency 2 (sum 26). An IDTx depends on an identity OTHER than the record modified, with an effect outside that record. That the count is small is itself a finding.</text>
