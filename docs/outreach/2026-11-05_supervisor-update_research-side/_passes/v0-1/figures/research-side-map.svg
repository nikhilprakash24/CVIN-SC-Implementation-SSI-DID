<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="22" fill="#1f2328">The research side: ten lanes around the dissertation, February – November 2026</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#5b6470">Solid border = outputs filed or in the hub repository · dashed = outputs still only in chat · ring = the thesis of record (D-R9, 30 Oct) · dotted boxes = held outside the filed corpus</text>

  <!-- centre: the dissertation -->
  <circle cx="600" cy="400" r="118" fill="#f6f8fa" stroke="#8b3a2f" stroke-width="3"/>
  <text x="600" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">The dissertation (D-R9)</text>
  <text x="600" y="392" text-anchor="middle" font-size="12" fill="#1f2328">7 chapters · ~68,000 words</text>
  <text x="600" y="410" text-anchor="middle" font-size="12" fill="#1f2328">spine: IMinimalSSI · RQ1–RQ3</text>
  <text x="600" y="428" text-anchor="middle" font-size="12" fill="#1f2328">Ch6: the applied system (code side)</text>
  <text x="600" y="448" text-anchor="middle" font-size="11" fill="#5b6470">frozen 31 Oct 2026</text>

  <!-- lane boxes: (x,y,w,h,title,line2,line3,dashed) -->
  <g font-size="12" fill="#1f2328">
    <!-- top row -->
    <rect x="60" y="100" width="230" height="78" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="175" y="121" text-anchor="middle" font-weight="bold">Specification &amp; derivation</text>
    <text x="175" y="139" text-anchor="middle">§2.3 v2.0 · irredundant cover · CR-1…3</text>
    <text x="175" y="156" text-anchor="middle">partition 3/5/4 · closure + F11</text>
    <text x="175" y="172" text-anchor="middle" fill="#5b6470">14 docs · analysis → Ch3</text>

    <rect x="485" y="100" width="230" height="78" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="600" y="121" text-anchor="middle" font-weight="bold">Evaluation of record</text>
    <text x="600" y="139" text-anchor="middle">§2.5 pre-registered 15 Oct · O1 verdict</text>
    <text x="600" y="156" text-anchor="middle">8 options 12/12 · protocol gas N=5 (D-R8)</text>
    <text x="600" y="172" text-anchor="middle" fill="#5b6470">hub sandbox + 7 verification folders → Ch4, Ch5</text>

    <rect x="910" y="100" width="230" height="78" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="1025" y="121" text-anchor="middle" font-weight="bold">Standards, families, MOBI VID</text>
    <text x="1025" y="139" text-anchor="middle">17 options · 6 families · Family E/G</text>
    <text x="1025" y="156" text-anchor="middle">ERC census (provisional) · VID mapping</text>
    <text x="1025" y="172" text-anchor="middle" fill="#5b6470">22 docs · framework → Ch5</text>

    <!-- middle row -->
    <rect x="40" y="300" width="230" height="78" rx="8" fill="#fff" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="155" y="321" text-anchor="middle" font-weight="bold">Security &amp; privacy</text>
    <text x="155" y="339" text-anchor="middle">T-1: 35 threats · 33 variables</text>
    <text x="155" y="356" text-anchor="middle">revocation window as safety budget · Ω</text>
    <text x="155" y="372" text-anchor="middle" fill="#5b6470">G-C1 filed; T-1, ISB, B5 chat-only</text>

    <rect x="930" y="300" width="230" height="78" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="1045" y="321" text-anchor="middle" font-weight="bold">Placement &amp; hybrid data</text>
    <text x="1045" y="339" text-anchor="middle">P-DT-1 four tests · HAA-1</text>
    <text x="1045" y="356" text-anchor="middle">boundary = Set A / Set B</text>
    <text x="1045" y="372" text-anchor="middle" fill="#5b6470">P1–P4 filed; HDA 18 docs in hub → Ch7</text>

    <rect x="40" y="440" width="230" height="78" rx="8" fill="#fff" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="155" y="461" text-anchor="middle" font-weight="bold">Cost, scale, latency</text>
    <text x="155" y="479" text-anchor="middle">14 cost classes · payload ladder</text>
    <text x="155" y="496" text-anchor="middle">"Tier-2 is not a ledger property"</text>
    <text x="155" y="512" text-anchor="middle" fill="#5b6470">G-CO1 prompts 1–3; Scale/Latency chats lost</text>

    <rect x="930" y="440" width="230" height="78" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="1045" y="461" text-anchor="middle" font-weight="bold">Agentic generalisation</text>
    <text x="1045" y="479" text-anchor="middle">φ: 5 exact / 7 modified / 0 absent</text>
    <text x="1045" y="496" text-anchor="middle">wrapper spec (App. I) · G-WHY</text>
    <text x="1045" y="512" text-anchor="middle" fill="#5b6470">G-E1 filed · analysis → Ch7</text>

    <!-- bottom row -->
    <rect x="60" y="600" width="230" height="78" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="175" y="621" text-anchor="middle" font-weight="bold">Governance &amp; verification</text>
    <text x="175" y="639" text-anchor="middle">Scaffolding · Manual · Registry v13.1</text>
    <text x="175" y="656" text-anchor="middle">cruxes X1–X7 · CEV · corrections K-1…28</text>
    <text x="175" y="672" text-anchor="middle" fill="#5b6470">36 docs · governs every chapter</text>

    <rect x="485" y="600" width="230" height="78" rx="8" fill="#fff" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="600" y="621" text-anchor="middle" font-weight="bold">Writing &amp; drafting programmes</text>
    <text x="600" y="639" text-anchor="middle">Sessions B–F · Thesis-A/B · Take 1</text>
    <text x="600" y="656" text-anchor="middle">G-GD1 · G-SD1 (origin tags) · Takes 2–4</text>
    <text x="600" y="672" text-anchor="middle" fill="#5b6470">61 unfiled output sets (D-18)</text>

    <rect x="910" y="600" width="230" height="78" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="1025" y="621" text-anchor="middle" font-weight="bold">Vision &amp; future programme</text>
    <text x="1025" y="639" text-anchor="middle">IoV transactions · reputation · FL</text>
    <text x="1025" y="656" text-anchor="middle">societal integration · bold claims ≤ L1</text>
    <text x="1025" y="672" text-anchor="middle" fill="#5b6470">20 docs · §5.5 + one worked example</text>

    <!-- outside the filed corpus -->
    <rect x="330" y="700" width="540" height="44" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="600" y="719" text-anchor="middle" fill="#1f2328">Held outside the filed corpus: March–May 2026 full pass (100+ notebook pages) ·</text>
    <text x="600" y="736" text-anchor="middle" fill="#1f2328">three-circle framing and seven perspectives · 2026 update — only the author can present these</text>

    <!-- roots (left of centre top) -->
    <rect x="300" y="210" width="170" height="56" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
    <text x="385" y="231" text-anchor="middle" font-weight="bold">Roots (G-R1)</text>
    <text x="385" y="248" text-anchor="middle">lineages → stack; R9 panel</text>
    <text x="385" y="262" text-anchor="middle" fill="#5b6470">27 papers in the code repo</text>

    <!-- code side (right of centre top) -->
    <rect x="730" y="210" width="170" height="56" rx="8" fill="#f6f8fa" stroke="#8b3a2f" stroke-width="2"/>
    <text x="815" y="231" text-anchor="middle" font-weight="bold">Code side (spoke)</text>
    <text x="815" y="248" text-anchor="middle">applied system → Ch6</text>
    <text x="815" y="262" text-anchor="middle" fill="#5b6470">see the code-side map</text>
  </g>

  <!-- arrows -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b8f95"/></marker></defs>
  <g stroke="#8b8f95" stroke-width="1.4" fill="none" marker-end="url(#a)" opacity="0.85">
    <line x1="290" y1="150" x2="505" y2="310"/>
    <line x1="600" y1="178" x2="600" y2="280"/>
    <line x1="910" y1="150" x2="695" y2="310"/>
    <line x1="270" y1="339" x2="483" y2="380"/>
    <line x1="930" y1="339" x2="717" y2="380"/>
    <line x1="270" y1="479" x2="483" y2="430"/>
    <line x1="930" y1="479" x2="717" y2="430"/>
    <line x1="290" y1="630" x2="505" y2="490"/>
    <line x1="600" y1="600" x2="600" y2="520"/>
    <line x1="910" y1="630" x2="695" y2="490"/>
    <line x1="385" y1="266" x2="520" y2="330"/>
    <line x1="815" y1="266" x2="680" y2="330"/>
  </g>
</svg>
