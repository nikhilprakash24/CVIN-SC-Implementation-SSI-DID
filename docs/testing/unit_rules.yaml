# Test files deliberately not registered, each with its reason. --check-complete fails on any tracked test file
# that is in none of: sources, results_derived, excluded.
excluded:
  - [1_blockchain-identity/_research-copies/, "archived copies of the pre-sandbox ERC-721 tests; not run by any suite or CI job"]
  - [cv2x-testbed/scripts/test_use_cases.py, "script-style; its 12 use cases run as tests in sandbox/py-suites/L4-exemplar-interactions/test_lifecycle_use_cases.py, which is registered"]
