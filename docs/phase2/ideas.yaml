    track: E
    title: "Open testbed release"
    question: "What must a third party install and run to reproduce the headline results, and how long does it take a newcomer?"
    why: "The original direction asks for an open-source testbed for a university connected-vehicles lab; the dashboard and grand runner exist."
    anchors: [N-2, N-11]
    builds_on: [docs/ORIGINAL_PROMPT_AND_DIRECTION.md, sandbox/grand/run.py, docs/figures/results_dashboard.html, cv2x-testbed/V2_COMPLETE_ROADMAP.md]
