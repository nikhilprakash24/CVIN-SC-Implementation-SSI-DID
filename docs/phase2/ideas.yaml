# Candidate programmes: coherent bundles the author chooses between (decision P2-D1).
programmes:
  - id: PG-focus
    title: "The author's three focuses (designated 2026-10-14, not chosen by score)"
    ideas: [I-24, I-25, I-26]
    thesis_effect: "F1 concept and F3 taxonomy enter chapter 6 with existing rows; measured studies follow the thesis (scope reconciliation)"
  - id: PG-alpha
    title: "Realistic deployment evidence"
    ideas: [I-01, I-02, I-03, I-11]
    thesis_effect: "moves C2, C3 and C7 off mock mobility and local chains"
  - id: PG-beta
    title: "Trust and revocation science"
    ideas: [I-05, I-04, I-07, I-13]
    thesis_effect: "gives C3 and C4 a model, a design and a proof obligation instead of only measurements"
  - id: PG-gamma
    title: "Privacy-preserving vehicle credentials"
    ideas: [I-10, I-09, I-11, I-17]
