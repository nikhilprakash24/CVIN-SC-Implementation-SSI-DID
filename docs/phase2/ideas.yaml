    track: W
    title: "An evidence-grounded explainer over the claim register"
    question: "Can a question-answering interface answer an examiner's questions about the work using only register rows, cruxes and their sources, and refuse when no V row supports an answer?"
    why: "The original sandbox brief included an LLM interface, later re-scoped as a possible defence demo; the register now gives it a ground truth to be held to."
