    scores: {value: 4, novelty: 2, feasibility: 5, reuse: 5, risk: 1}
  - id: I-17
    track: S
    title: "Vehicle credentials in the EU digital identity wallet framework"
    question: "How do Phase 1's vehicle credentials map onto the EU digital identity wallet architecture (issuers, relying parties, trust lists), and what is missing for a vehicle as a credential holder?"
    why: "Phase 1 is grounded in W3C and MOBI only; a regulatory mapping widens the thesis's external relevance (C5, C6)."
