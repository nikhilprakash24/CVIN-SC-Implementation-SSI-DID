  - id: I-16
    track: S
    title: "W3C external validity on chain-backed documents"
    question: "Do the official DID and VC test suites still pass when the resolver reads chain state instead of synthesising the document from the identifier?"
    why: "C5 rests on a synthesised document; the 94.3 % figure is a structural self-score (#4); WM-2 C1 makes the resolver read the chain."
    anchors: [C5, "#4", "#24"]
    builds_on: [2_w3c-ssi-layer/did-resolution, docs/conformance, cv2x-testbed/scripts/w3c_compliance_checker.py]
