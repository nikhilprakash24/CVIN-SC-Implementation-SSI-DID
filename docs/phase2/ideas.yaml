# Phase 2 idea register: data (P2.0, session 1, 2026-10-14). Author: Nikhil Prakash (MASc, UBC ECE).
# docs/phase2/build_phase2.py turns this into IDEA_REGISTER.md and checks it (CI): every anchor must exist
# in the Phase 1 artefact it names; every idea must cite at least one Phase 1 anchor and one file it builds on.
#
# Anchor kinds:  row "#27" (docs/MEASUREMENT_CONDITIONS.md) · crux "C3" (docs/thesis/CRUX_REGISTER.md) ·
#   defect "D51" (docs/DEFECT_LOG.md) · next "N-16" (docs/MILESTONE_NEXT.md) · sp "SP-1" (SIDE_PAPERS.md) ·
#   sc "SC-12" (docs/SCOPE_CHANGES.md) · file "<path>" (must exist).
# Scores are 1-5, orchestrator estimates written in session 1; the author overrides any of them
# (record the override in DECISIONS.md, then edit here). risk: 5 = riskiest. Weights below.
weights: {value: 0.30, novelty: 0.20, feasibility: 0.20, reuse: 0.15, safety: 0.15}   # safety = 6 - risk
scored_by: "orchestrator estimate, Phase 2 session 1 (2026-10-14); not yet reviewed by the author"

tracks:
  R: Realism of the evaluation (mobility, radio, public chains)
  T: Trust and revocation architecture
  P: Privacy of vehicle identity
  A: Assurance (formal methods, model checking, fuzzing)
  S: Standards and industry alignment
  E: Evidence platform and open release
  W: Writing, dissemination and interfaces

ideas:
  - id: I-01
    track: R
    title: "Real mobility drives the existing V2V/V2I layer (SUMO + TraCI)"
    question: "Do verification load, freshness behaviour and the infrastructure results (#44-#46) change when vehicle positions, densities and contact times come from a traffic simulation instead of mock mobility?"
    why: "Every latency and freshness result of Phase 1 is under mock mobility; the crux register names this the main gap of C2 and C3."
    anchors: [C2, C3, N-4, SC-22, "#27", "#44"]
    builds_on: [cv2x-testbed/sumo/sumo_identity_integration.py, cv2x-testbed/sumo/infrastructure_layer.py, docs/PLAN_SUMO_VISUALISATION.md]
    first_step: "A TraCI mobility adapter behind the mock-mobility interface the drivers already use; one scenario (S1) replayed under both; compare the per-vehicle neighbour-count distribution."
    kill: "If the neighbour-count and contact-time distributions match the mock within a band set before the run, keep mock mobility and record the comparison as the result."
    depends: []
    scores: {value: 5, novelty: 2, feasibility: 4, reuse: 5, risk: 2}
  - id: I-02
    track: R
    title: "Channel access in the latency budget (C-V2X mode 4 or 802.11p via ns-3 / OMNeT++ Veins)"
    question: "How much of the 100 ms safety budget is left for identity verification once channel access, packet loss and retransmission are simulated?"
    why: "Phase 1 verifies within the budget computationally (#27) but has no radio or MAC; chapter 5 names the end-to-end budget as future work."
    anchors: [C2, "#27", SC-03]
    builds_on: [docs/thesis/chapter5-results/README.md, cv2x-testbed/sumo/run_v2v_stats.py]
    first_step: "A spike that couples one simulator to the existing message path for a two-vehicle exchange and measures integration effort, before any experiment is designed."
    kill: "If the spike needs more than two sessions to exchange one signed message, move to a literature-calibrated channel model instead."
    depends: [I-01]
    scores: {value: 4, novelty: 3, feasibility: 2, reuse: 3, risk: 4}
  - id: I-03
    track: R
    title: "Public-chain witness and rollup economics"
    question: "Do the nine-standard gas rankings hold on a public testnet and on an L2 rollup, and what does a vehicle identity cost in fees over its life once calldata pricing and blob fees apply?"
    why: "All gas is local (M1); chapter 6 leaves the dollar calibration of the cost frontier to future work; v0.9.0 is defined by a Sepolia witness."
    anchors: [N-11, "#25", "#26", C1]
    builds_on: [1_blockchain-identity/scripts/validate_sepolia.js, 1_blockchain-identity/SEPOLIA_VALIDATION.md, 1_blockchain-identity/scripts/benchmark_gas.js, docs/thesis/chapter6-discussion/README.md]
    first_step: "Run the existing Sepolia validation (author decision N-11: secrets), then the benchmark on one rollup testnet with the same contracts; compare rankings, not absolute numbers."
    kill: "None needed for the witness; the rollup arm stops if the ranking is unchanged and fee data cannot be stated under a dated condition."
    depends: []
    scores: {value: 4, novelty: 3, feasibility: 4, reuse: 5, risk: 2}
  - id: I-04
    track: T
    title: "Infrastructure trust mesh (RSU-to-RSU revocation propagation and handover)"
    question: "How quickly does a revocation reach every RSU on a corridor, and what does a vehicle crossing RSU boundaries experience, when RSUs exchange revocation state peer to peer instead of each reading the chain?"
    why: "C3 lists \"no RSU-to-RSU\" among its five gaps; N-16 asks for a design note first."
    anchors: [C3, N-16, N-17, "#46"]
    builds_on: [cv2x-testbed/sumo/infrastructure_layer.py, docs/design]
    first_step: "The N-16 design note (WM-2 D2) extended into a protocol sketch with two candidate propagation rules and the metric each would be judged by."
    kill: "If the design note shows the thesis claims for C3 do not need it, it stays a Phase 2 study, not a thesis chapter."
    depends: [I-05]
    scores: {value: 4, novelty: 4, feasibility: 3, reuse: 4, risk: 3}
  - id: I-05
    track: T
    title: "A theory of revocation freshness (k, time bounds and their optimum)"
    question: "Given a revocation rate, a verification cost and a chain-read cost, which re-check policy minimises cost subject to a bound on accepting a revoked credential, and does the measured knee (#32, #37) match it?"
    why: "Phase 1 measures k empirically and states that a message bound is not a time bound (guide 1.1.9); the thesis must still choose k (C4, N-17), and D51 shows the clock matters."
    anchors: [C4, N-17, D51, "#32", "#37", "#46"]
    builds_on: [cv2x-testbed/identity/freshness.py, cv2x-testbed/scripts/experiment_freshness_k.py, docs/STYLE_AND_RIGOUR_GUIDE.md]
    first_step: "Write the cost model on paper with its assumptions, derive the optimal policy for message-bounded and time-bounded caches, and predict the knee for the Phase 1 conditions before re-reading the measurements."
    kill: "If the model cannot predict the measured knee within its own stated error, report the mismatch and use it to choose k by rule, not to claim a theory."
    depends: []
    scores: {value: 5, novelty: 4, feasibility: 4, reuse: 5, risk: 2}
  - id: I-06
    track: T
    title: "Hybrid PKI and DID (IEEE 1609.2 certificates anchored to decentralized identifiers)"
    question: "Can a vehicle keep 1609.2-style pseudonym certificates on the hot path while the issuing authority's keys and revocation live in a DID registry, and what does it cost against each pure design?"
    why: "Phase 1 measures PKI and SSI side by side (#27); V2 question 8 (hybrid) was demoted to future work as PhD-scale (SC-03)."
    anchors: [SC-03, C1, C2, "#27"]
    builds_on: [cv2x-testbed/identity/standard/pki_identity.py, cv2x-testbed/identity/erc1056_provider.py, cv2x-testbed/V2_DESIGN.md]
    first_step: "A scoped design (one authority, one revocation path) with its threat model, to size whether it is MASc-sized or must stay future work."
    kill: "If the scoped design needs a new SCMS baseline to be meaningful, keep it as a written proposal."
    depends: []
    scores: {value: 4, novelty: 4, feasibility: 2, reuse: 4, risk: 4}
  - id: I-07
    track: T
    title: "Misbehaviour detection to revocation, end to end"
    question: "How long from a detectable misbehaviour to a revoked identity being refused by every verifier, and which link dominates (detection, governance, chain inclusion, freshness)?"
    why: "Phase 1 measures the freshness end of this chain only; V2 question 9 (ML misbehaviour detection) was demoted (SC-03)."
    anchors: [C4, C3, SC-03, "#46"]
    builds_on: [cv2x-testbed/identity/freshness.py, cv2x-testbed/sumo/infrastructure_layer.py, cv2x-testbed/V2_COMPLETE_ROADMAP.md]
    first_step: "A time-to-exclusion decomposition with a rule-based detector (no ML) and the existing freshness policy, as a design and measurement plan."
    kill: "If detection quality dominates and cannot be measured without real data, narrow to \"time from decision to exclusion\"."
    depends: [I-05, I-01]
    scores: {value: 4, novelty: 3, feasibility: 3, reuse: 4, risk: 3}
  - id: I-08
    track: T
    title: "Chain-bound signed operations (the cross-chain replay and owner-0 cases)"
    question: "What does binding the chain id into ERC-1056 signed operations cost, and is a byte-faithful upstream registry defensible for vehicles given D52?"
    why: "D52 (no chain id in the signed digest) and D53 (owner 0) are open design questions tied to the upstream-fidelity decision (N-9, review-2 K-12)."
    anchors: [D52, D53, N-9]
    builds_on: [1_blockchain-identity/contracts, docs/DEFECT_LOG.md]
    first_step: "A variant contract beside the upstream one, its regression tests (each failing on the upstream), and the gas delta per signed operation."
    kill: "None; small and bounded. It feeds N-9."
    depends: []
    scores: {value: 3, novelty: 2, feasibility: 5, reuse: 5, risk: 1}
  - id: I-09
    track: P
    title: "Zero-knowledge VIN tier"
    question: "Can a vehicle prove VIN-bound properties (manufacturer, model year, registration region) without revealing the VIN or a linkable hash, at a verify cost inside the V2V budget?"
    why: "The three-tier VIN privacy design left the ZK tier as future work (SC-12); SP-3 covers the hash-and-encrypt tiers only."
    anchors: [SC-12, C7, SP-3]
    builds_on: [MOBI_VID_RESEARCH.md, cv2x-testbed/scripts/test_vin_encryption.py]
    first_step: "A literature and tooling survey (circuit size, proving and verifying time for the three properties) before any circuit is written."
    kill: "If verification cannot fit the budget on vehicle-class hardware per the literature, keep it as an off-hot-path (registration-time) proof only."
    depends: []
    scores: {value: 3, novelty: 5, feasibility: 2, reuse: 2, risk: 4}
  - id: I-10
    track: P
    title: "Selective-disclosure vehicle credentials (SD-JWT VC, BBS signatures) on the hot path"
    question: "What do selective-disclosure credential formats cost to verify against the current VC suite, and which disclosures does a V2V or V2I verifier actually need?"
    why: "C5 is structural and C7 has no hypothesis; Phase 1 measured credential richness against verify time (#26, #27) for one suite only."
    anchors: [C5, C7, "#26", "#27"]
    builds_on: [2_w3c-ssi-layer/verifiable-credentials, 4_comparison-framework/performance-metrics/run_verify_richness.py]
    first_step: "A disclosure-needs table per message type (BSM, SPaT, MAP) written from the existing message schemas, then one SD-JWT VC prototype measured with the richness driver."
    kill: "If no message type needs selective disclosure on the hot path, the idea moves to registration and service-access flows."
    depends: []
    scores: {value: 4, novelty: 3, feasibility: 4, reuse: 4, risk: 2}
  - id: I-11
    track: P
    title: "Linkability beyond the ledger (timing, position and pseudonym-change attacks)"
    question: "With real mobility, how linkable are a vehicle's pseudonyms through timing and position alone, and how much does each Phase 1 identity design add or remove?"
    why: "C7 records radio, timing and position linkability as future work; the pseudonym-pool experiment found the delegate pool fully linkable on-chain."
    anchors: [C7, "#38", SC-12]
    builds_on: [1_blockchain-identity/scripts/experiment_pseudonym_pool.js, docs/thesis/CRUX_REGISTER.md]
    first_step: "Choose one published linkability metric and one tracker, applied to SUMO traces with identity overlays; pre-register the comparison."
    kill: "If real mobility (I-01) is not available, stop: mock positions would measure the mock."
    depends: [I-01]
    scores: {value: 4, novelty: 4, feasibility: 3, reuse: 3, risk: 3}
  - id: I-12
    track: A
    title: "Formal properties of the identity contracts"
    question: "Which security properties (owner-only mutation, revocation monotonicity, no identity seizure) can be proved for the nine contracts with off-the-shelf tools, and do the proofs find what the attack harness missed?"
    why: "Chapter 7 lists formal verification as future work; D53 (owner 0) and D54 (attestation authority) were found by reading, not by the 43-cell attack harness (#28)."
    anchors: [D53, D54, "#28", C1]
    builds_on: [1_blockchain-identity/contracts, 4_comparison-framework/security-analysis, docs/thesis/chapter7-conclusion/README.md]
    first_step: "Three properties stated in prose for two contracts, then checked with the Solidity compiler's model checker and one symbolic tool; D53 used as the must-find target."
    kill: "If neither tool finds D53 on the unfixed contract, report the tool limitation and stop."
    depends: []
    scores: {value: 3, novelty: 3, feasibility: 4, reuse: 4, risk: 2}
  - id: I-13
    track: A
    title: "Model checking the revocation and cache protocol"
    question: "Does a formal model of verifier caches, RSU caches and chain time admit a run in which a revoked key is accepted, and under which clock assumptions?"
    why: "D51 (clock skew accepts a revoked key) is exactly the kind of interleaving a model checker finds; C3 and C4 rest on cache rules nobody has modelled."
    anchors: [D51, C4, C3, N-17]
    builds_on: [cv2x-testbed/identity/erc1056_provider.py, cv2x-testbed/identity/freshness.py]
    first_step: "A small TLA+ or PlusCal model of one verifier, one chain and one revocation, required to rediscover D51 before it is extended to RSUs."
    kill: "If the model cannot rediscover D51, it is not modelling the system; stop."
    depends: []
    scores: {value: 4, novelty: 4, feasibility: 4, reuse: 3, risk: 2}
  - id: I-14
    track: A
    title: "Property-based fuzzing of the message verifier"
    question: "What does property-based fuzzing of the infrastructure verifier find beyond the six robustness defects the audit found by hand?"
    why: "D37-D42 were found by auditors reading code; the verifier v3 (WM-2 C0) will fix them, and a fuzzer is the regression net."
    anchors: [D37, D38, D39, D40, D41, D42]
    builds_on: [cv2x-testbed/sumo/infrastructure_layer.py, sandbox/py-suites/L3-ssi/mutation/mutate_infrastructure_layer.py]
    first_step: "Hypothesis strategies for SPaT/MAP/BSM messages and credentials; required to rediscover D37 and D39 on the pre-v3 code."
    kill: "None; it becomes part of the test suite."
    depends: []
    scores: {value: 3, novelty: 2, feasibility: 5, reuse: 5, risk: 1}
  - id: I-15
    track: S
    title: "MOBI VID conformance completion and standards engagement"
    question: "What would full VID I MUST coverage take, and which Phase 1 findings (fidelity per backend, the attestation fix) are contributions MOBI could adopt?"
    why: "C6 records few VID I MUSTs met and missing birth-certificate fields; SC-17 and SC-18 are pending; chapter 7 lists standardization engagement."
    anchors: [C6, SC-17, SC-18, SP-4, SP-1]
    builds_on: [MOBI_VID1_TECHNICAL_SPEC.md, 2_w3c-ssi-layer/mobi-vid]
