<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="900" height="560" fill="#fff"/>
<text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold">FIG-R3 · The trilemma as a cost surface, with the programme's solutions placed (R3 Part III)</text>
<text x="450" y="46" text-anchor="middle" font-size="10" fill="#666">Security fixed at the level identity requires (R7, I8, R5). Axes: trust base (decentralisation) vs finality latency &amp; cost variance (inverse scalability)</text>
<line x1="90" y1="470" x2="560" y2="470" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="90" y1="470" x2="90" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="330" y="500" text-anchor="middle" font-size="11" font-weight="bold">Trust base → (who must collude to break R7)</text>
<text x="100" y="475" font-size="9">N_v = 1</text><text x="230" y="488" font-size="9" text-anchor="middle">known consortium</text><text x="400" y="488" font-size="9" text-anchor="middle">rollup + L1</text><text x="530" y="488" font-size="9" text-anchor="middle">open L1</text>
<text x="40" y="275" font-size="11" font-weight="bold" transform="rotate(-90 40 275)" text-anchor="middle">Finality latency &amp; cost variance →</text>
<text x="85" y="460" font-size="9" text-anchor="end">0</text><text x="85" y="380" font-size="9" text-anchor="end">block period</text><text x="85" y="260" font-size="9" text-anchor="end">seconds / batch</text><text x="85" y="130" font-size="9" text-anchor="end">minutes, variance</text>
<path d="M95,465 C 200,400 300,300 540,110" stroke="#bbb" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
<text x="470" y="200" font-size="9" fill="#888">frontier without anchoring</text>
<circle cx="100" cy="460" r="9" fill="#eeeeee" stroke="#555" stroke-width="2"/><text x="115" y="452" font-size="10" font-weight="bold">SOL-01 sandbox</text><text x="115" y="464" font-size="9">measurement point, no security</text>
<circle cx="230" cy="380" r="9" fill="#d9e7f5" stroke="#2c5a8c" stroke-width="2"/><text x="245" y="372" font-size="10" font-weight="bold">SOL-02 consortium QBFT (A)</text><text x="245" y="384" font-size="9">deterministic, free-gas; residual: collusion</text>
<circle cx="400" cy="270" r="9" fill="#fde2c8" stroke="#c46f00" stroke-width="2"/><text x="415" y="262" font-size="10" font-weight="bold">SOL-04 public L2 (B)</text><text x="415" y="274" font-size="9">soft-seconds, L1-hard tail; sequencer row</text>
<circle cx="530" cy="130" r="9" fill="#fde2c8" stroke="#c46f00" stroke-width="2"/><text x="440" y="110" font-size="10" font-weight="bold">SOL-04 public L1 (C)</text><text x="440" y="122" font-size="9">probabilistic; C16 variance</text>
<line x1="240" y1="374" x2="330" y2="368" stroke="#5c3d8c" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="340" cy="368" r="11" fill="#fff1c9" stroke="#a37a00" stroke-width="2.5"/><text x="356" y="356" font-size="10" font-weight="bold" fill="#6b5000">SOL-05 HAA-1 = SOL-02 + SOL-03</text><text x="356" y="368" font-size="9">public checkpoint moves the point right at ~zero latency cost:</text><text x="356" y="380" font-size="9">collusion becomes provable (detection, not prevention)</text>
<text x="250" y="405" font-size="9" fill="#5c3d8c">SOL-03 anchoring vector</text>
<rect x="590" y="300" width="290" height="170" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="600" y="320" font-size="11" font-weight="bold">Reading the surface</text>
<text x="600" y="340" font-size="9">• Dashed frontier: trust base bought only with latency/variance (T-03 forces cost or identity)</text>
<text x="600" y="356" font-size="9">• SOL-03 is off-frontier: it buys detectability, not trust-base size</text>
<text x="600" y="372" font-size="9">• Residual at SOL-05: BP-L4-04/06 as governance; BP-L0-05 as ownership</text>
<text x="600" y="388" font-size="9">• Tier 1/2 never sit on this surface: read-path rule keeps them off-ledger (BP-L7-07)</text>
<text x="600" y="404" font-size="9">• SOL-07/08/09 are L6/L7 choices layered on any point</text>
<text x="600" y="430" font-size="9" fill="#666">Zooko form: decentralised · secure · human-meaningful — DIDs drop the third (T-I16)</text>
<text x="450" y="540" text-anchor="middle" font-size="9.5" fill="#666">Numbers for the axes are PF-⟦13, 16, 19, 23, 28⟧ in R4</text>
</svg>