<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="600" fill="#fff"/>
<text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold">FIG-R4 · HAA-1 hybrid anchored architecture with the trust boundaries drawn (R3 Part III, P3 §2)</text>
<rect x="30" y="60" width="840" height="70" rx="6" fill="#fde2c8" stroke="#c46f00" stroke-width="2"/>
<text x="42" y="82" font-size="12" font-weight="bold" fill="#7a4300">PUBLIC CHAIN (settlement Option B/C) — trust base: open validators/miners · L3–L5 · T-13 / T-12</text>
<text x="42" y="100" font-size="10">Receives one checkpoint per interval τ_a: the consortium's state root in commitment form (T-I15). Cost: one A2-rung tx. Role: makes any rewrite or collusion below PROVABLE (SOL-03).</text>
<text x="42" y="118" font-size="10" fill="#7a4300">Residual here: BP-L0-04 mempool metadata (batch = one writer) · BP-L3-05 probabilistic finality of the checkpoint itself (PF-⟦13, 19⟧)</text>
<line x1="450" y1="210" x2="450" y2="135" stroke="#5c3d8c" stroke-width="3" marker-end="url(#a)"/>
<text x="462" y="178" font-size="10" fill="#5c3d8c" font-weight="bold">checkpoint (anchoring the anchor)</text>
<rect x="30" y="210" width="840" height="300" rx="8" fill="none" stroke="#2c5a8c" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="42" y="230" font-size="11" font-weight="bold" fill="#1d3d60">CONSORTIUM TRUST BOUNDARY — governance-diverse validator set N_v ≥ 3f_B+1 (SOL-02, T-12) · residual BP-L4-04/06</text>
<rect x="50" y="245" width="390" height="110" rx="6" fill="#d9e7f5" stroke="#2c5a8c" stroke-width="1.5"/>
<text x="62" y="265" font-size="12" font-weight="bold" fill="#1d3d60">PLANE A · Anchor / settlement (Besu QBFT, O11)</text>
<text x="62" y="283" font-size="9.5">DID documents, key history, schemas, CRED_DEF, status roots / accumulator values</text>
<text x="62" y="298" font-size="9.5">Deterministic finality ≈ block period · no public mempool · free-gas → M-T2 capacity</text>
<text x="62" y="313" font-size="9.5">Interface: IMinimalSSI registry face (SOL-06, Set A + revokeCredential)</text>
<text x="62" y="330" font-size="9.5" fill="#1d3d60">Closes: BP-L0-03/04, L3-05, L4-01/02/03, L5-05 · Accepts: L4-04/05/06</text>
<text x="62" y="346" font-size="9.5" fill="#1d3d60">Private groups (Paladin O15): payload to parties only; privacy marker hash on-chain</text>
<rect x="460" y="245" width="390" height="110" rx="6" fill="#ece3f5" stroke="#5c3d8c" stroke-width="1.5"/>
<text x="472" y="265" font-size="12" font-weight="bold" fill="#3d2560">PLANE V · Verification / status service</text>
<text x="472" y="283" font-size="9.5">Serves DID resolution and status (Profile SL list / Profile AC value) from a σ-bounded cache</text>
<text x="472" y="298" font-size="9.5">Every response carries the Plane-A root it derives from → verifier root-checks (closes BP-L2-05)</text>
<text x="472" y="313" font-size="9.5">ttl set from the W budget, not from load (BP-L6-04, BP-L7-03)</text>
<text x="472" y="330" font-size="9.5" fill="#3d2560">Trust: k independent instances; eclipse of one is not eclipse of the verifier (BP-L0-01)</text>
<text x="472" y="346" font-size="9.5" fill="#3d2560">Herd privacy: status list ≥ 131,072 entries (PF-⟦29⟧)</text>
<rect x="50" y="370" width="390" height="120" rx="6" fill="#eeeeee" stroke="#555" stroke-width="1.5"/>
<text x="62" y="390" font-size="12" font-weight="bold">PLANE D · Data availability / archive</text>
<text x="62" y="408" font-size="9.5">Archive-node ring (full event history, R-R3) · CAS pinned (schema docs, tails files, witnesses)</text>
<text x="62" y="423" font-size="9.5">Issuer archives for recovery obligations · blobs as rollup DA under Option B only</text>
<text x="62" y="440" font-size="9.5" fill="#333">Every class has a NAMED availability owner — availability is not a cryptographic property</text>
<text x="62" y="458" font-size="9.5" fill="#333">Closes: BP-L0-05, L2-04 (by ownership) · BP-L2-03 witness distribution</text>
<text x="62" y="478" font-size="9.5" fill="#333">PF-⟦5, 14⟧</text>
<rect x="460" y="370" width="390" height="120" rx="6" fill="#fff1c9" stroke="#a37a00" stroke-width="1.5"/>
<text x="472" y="390" font-size="12" font-weight="bold" fill="#6b5000">HOLDER / WALLET PLANE (vehicle ECU, person, agent)</text>
<text x="472" y="408" font-size="9.5">Keys in hardware (BP-L1-01/07) · credential CONTENT lives here, never on-chain (S5)</text>
<text x="472" y="423" font-size="9.5">Builds presentations: ZK proof + predicate + non-revocation (T-I10/11/14, O12) — the X2 function</text>
<text x="472" y="440" font-size="9.5" fill="#6b5000">Talks to issuers / verifiers over DIDComm v2 (O16) — the L7 channel, keys resolved via Plane V</text>
<text x="472" y="458" font-size="9.5" fill="#6b5000">Tier 1/2 path: reads cached L6 state only (BP-L7-07) · Tier 3: the only ledger writes</text>
<text x="472" y="478" font-size="9.5" fill="#6b5000">Residual: BP-L7-01 endpoint compromise — out of cryptographic scope</text>
<line x1="440" y1="300" x2="460" y2="300" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="245" y1="355" x2="245" y2="370" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="655" y1="370" x2="655" y2="355" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="440" y1="430" x2="460" y2="430" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="292" font-size="8" text-anchor="middle">root</text><text x="258" y="366" font-size="8">events</text><text x="662" y="366" font-size="8">read</text><text x="450" y="424" font-size="8" text-anchor="middle">witness</text>
<text x="450" y="540" text-anchor="middle" font-size="10" font-weight="bold">Three motions: WRITE (wallet → Plane A, Tier 3) · READ (wallet/verifier ← Plane V, σ-bounded, root-checked) · REVOKE (issuer → Plane A → Plane V/D, the W path)</text>
<text x="450" y="560" text-anchor="middle" font-size="9.5" fill="#666">Four-way separation (E2+E6): public anchoring · public status · private content · provable claims — EDPB v2.0 ¶52–54 posture</text>
<text x="450" y="580" text-anchor="middle" font-size="9.5" fill="#666">The hybrid trades prevention for detection at L4: collusion inside the dashed boundary cannot be hidden from anyone holding the public root</text>
</svg>