<text x="15.0" y="496.0" font-size="9" text-anchor="start" fill="#222">Reading: at 99 % availability with 10-minute outages the mean is 14.5 s but p99.9 is 1390.1 s (≈ 23 min). Revocation guarantees must be stated as tail quantiles of the down-time, not as availability percentages.</text>
<text x="15.0" y="509.0" font-size="9" text-anchor="start" fill="#222">p99 = W_0 where 1 − A_L ≤ 1 − q (atom at W_0). Monte Carlo (2e6 draws, seed 42) agrees within 1.34 % on every non-degenerate cell; the A_L = 0.99, q = 0.99 edge cell is excluded (sampling artefact).</text>
<text x="15.0" y="522.0" font-size="9" text-anchor="start" fill="#222">A poll-based RSU adds 0.5 s mean / 1 s max, 5.0 s mean / 10 s max, 30.0 s mean / 60 s max for T_p = 1 / 10 / 60 s. The repo's RSU rows (#46) bound staleness in messages with no propagation model (Q-R7-05).</text>
<text x="15.0" y="535.0" font-size="9" text-anchor="start" fill="#666">Caveat: the whole model is Ds (exponential down-times, stationary renewal); no backhaul was measured. Values parsed from r7_calc_v0-2.py output; cited tags PF-48, PF-28, BP-L0.2-01, RV-SVC-03.</text>
