<text x="15.0" y="530.0" font-size="9" text-anchor="start" fill="#222">Reading: a curve crossing the dashed 50 ms line marks the neighbour count where verification alone uses the identity budget; crossing the red 100 ms line, the verifier queue is unstable.</text>
<text x="15.0" y="543.0" font-size="9" text-anchor="start" fill="#222">The MCU HSM class saturates at P = 20 and the Cortex-A53 class at P = 100, below the 37–182 vehicles the channel can carry; the repo's JSON encoding caps the channel first for software verifiers.</text>
<text x="15.0" y="556.0" font-size="9" text-anchor="start" fill="#222">The ledger enters only through state refreshes: with k_f ≥ 27.9 (refresh-load criterion, P = 100) refreshes stay inside the budget; the whole-path criterion needs k_f ≥ 91 (#32 knee ≈ 90).</text>
<text x="15.0" y="569.0" font-size="9" text-anchor="start" fill="#222">Under HAA-1 (k_f → ∞) both criteria reduce to a pure verification-hardware condition.</text>
<text x="15.0" y="582.0" font-size="9" text-anchor="start" fill="#666">Caveats: Xeon rows are M (#27) on a server host, not an OBU (NC-05); ASIC/HSM, A53 and MCU classes are E (LIM-R7-03); PF-44 sizes are E (LIM-R7-02/07). Numbers parsed from r7_calc_v0-2.py output.</text>
